general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(24, 28, 34, 1.0)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgba(88c0d0ff)
    inner_color = rgba(46, 52, 64, 1.0)
    font_color = rgba(236, 239, 244, 1.0)
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)

    placeholder_text = password
    hide_input = false
    rounding = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(236, 239, 244, 1.0)
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}
