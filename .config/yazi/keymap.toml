[mgr]
prepend_keymap = [
  # ── File operations: new bindings ──────────────────────────────────────────
  { on = "<C-x>",    run = "yank --cut", desc = "Cut files" },
  { on = "<C-c>",    run = "yank",       desc = "Copy files" },
  { on = "<C-v>",    run = "paste",      desc = "Paste files" },
  { on = "<C-d>",    run = "remove",     desc = "Trash files" },
  { on = "<C-n>",    run = "create",     desc = "Create file or directory" },
  { on = "<C-r>",    run = "rename",     desc = "Rename" },
  { on = "e",        run = "open",       desc = "Open/edit file" },
  # `E` = nvim で縦分割して開く。nvim 側の terminal マッピングだと rename 入力中の
  # `E` まで横取りされるため、[mgr] 限定で DDS publish し yazi.nvim に処理させる。
  { on = "E",        run = "shell 'ya pub-to 0 yazi-nvim-vsplit'", desc = "Open in vertical split (nvim)" },

  # ── Filename / path copy ───────────────────────────────────────────────────
  { on = ["y", "y"], run = "copy filename", desc = "Copy filename" },
  { on = "Y",        run = "copy path",     desc = "Copy full path" },

  # ── Selection: move toggle off <Space> so nvim can use <Space>t… for tabs ──
  { on = "m",        run = ["toggle", "arrow 1"], desc = "Toggle selection" },
  { on = "<Space>",  run = "noop" },

  # ── Disable default file operation keys ───────────────────────────────────
  { on = "y", run = "noop" },
  { on = "x", run = "noop" },
  { on = "p", run = "noop" },
  { on = "P", run = "noop" },
  { on = "X", run = "noop" },
  { on = "d", run = "noop" },
  { on = "D", run = "noop" },
  { on = "a", run = "noop" },
  { on = "r", run = "noop" },

  # ── Disable path copy chords ───────────────────────────────────────────────
  { on = ["c", "c"], run = "noop" },
  { on = ["c", "d"], run = "noop" },
  { on = ["c", "f"], run = "noop" },
  { on = ["c", "n"], run = "noop" },
]
