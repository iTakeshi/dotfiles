log_level = "warn"
outputs = "All"
position = "Top"

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = [ "Clock", [ "Tray", "Settings" ] ]

[clock]
format = "%a %b %e  %H:%M:%S"

[window_title]
truncate_title_after_length = 60

[settings]
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

[appearance]
workspace_colors = ["#444444"]
special_workspace_colors = ["#333333"]
